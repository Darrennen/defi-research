<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMA Cross Scanner — Binance USDT spot</title>
<style>
  :root {
    color-scheme: light;
    --page:      #f9f9f7;
    --surface:   #fcfcfb;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --grid:      #e1e0d9;
    --baseline:  #c3c2b7;
    --border:    rgba(11,11,11,0.10);
    --good:      #0ca30c;
    --bad:       #d03b3b;
    --good-text: #006300;
    --bad-text:  #b02f2f;
    --good-wash: rgba(12,163,12,0.10);
    --bad-wash:  rgba(208,59,59,0.10);
    --hover:     rgba(11,11,11,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface:   #1a1a19;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --muted:     #898781;
      --grid:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,0.10);
      --good-text: #0ca30c;
      --bad-text:  #e06666;
      --good-wash: rgba(12,163,12,0.16);
      --bad-wash:  rgba(208,59,59,0.18);
      --hover:     rgba(255,255,255,0.05);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --good-text: #0ca30c; --bad-text: #e06666;
    --good-wash: rgba(12,163,12,0.16); --bad-wash: rgba(208,59,59,0.18);
    --hover: rgba(255,255,255,0.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 28px 24px 80px; }

  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  h1 { font-size: 19px; font-weight: 620; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 6px 0 22px; }
  .sub b { color: var(--ink-2); font-weight: 560; }

  button, select, input[type=search] {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 9px;
  }
  button { cursor: pointer; }
  button:hover { background: var(--hover); }
  #rescan { font-size: 12.5px; padding: 6px 12px; }
  #rescan[disabled] { opacity: 0.5; cursor: default; }

  /* ---- controls ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 18px 22px; align-items: flex-end; margin-bottom: 22px; }
  .ctl { display: flex; flex-direction: column; gap: 5px; }
  .ctl > label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 560; }
  .seg { display: flex; gap: 2px; background: var(--grid); padding: 2px; border-radius: 8px; }
  .seg button {
    border: none; background: transparent; border-radius: 6px;
    padding: 4px 11px; font-size: 13px; color: var(--ink-2);
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 580; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  input[type=search] { width: 150px; }

  /* ---- breadth tiles ---- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 2px; margin-bottom: 26px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    padding: 13px 15px 14px; border-radius: 4px;
  }
  .tile .tf { font-size: 11.5px; font-weight: 620; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .tile .big { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; margin: 3px 0 1px; line-height: 1.1; }
  .tile .cap { font-size: 11.5px; color: var(--muted); }
  .tile .fr { font-size: 11.5px; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--grid); display: flex; gap: 10px; }
  .meter { height: 3px; background: var(--grid); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .meter i { display: block; height: 100%; background: var(--good); border-radius: 2px; }

  /* ---- table ---- */
  .tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--surface);
    text-align: right; font-weight: 560; font-size: 11px; letter-spacing: 0.045em;
    text-transform: uppercase; color: var(--muted); white-space: nowrap;
    padding: 10px 9px; border-bottom: 1px solid var(--baseline); cursor: pointer; user-select: none;
  }
  thead th:first-child, thead th.l { text-align: left; }
  thead th.mid { text-align: center; }
  thead th:hover { color: var(--ink); }
  thead th .ar { opacity: 0.85; font-size: 9px; }
  tbody td { padding: 7px 9px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody td.l { text-align: left; }
  tbody tr:hover { background: var(--hover); }
  tbody tr:last-child td { border-bottom: none; }
  .coin { font-weight: 580; }
  .coin small { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 1px; }
  .coin small.tag { margin-left: 5px; padding: 1px 4px; border: 1px solid var(--border);
    border-radius: 4px; font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; }
  .up { color: var(--good-text); }
  .dn { color: var(--bad-text); }
  .dim { color: var(--muted); }

  /* state pill: glyph + number carry the state, colour only reinforces
     (green/red is ΔE 4.1 under deuteranopia — never rely on hue alone) */
  td.cell { padding: 4px 3px; text-align: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 3px; justify-content: center;
    min-width: 46px; padding: 3px 5px; border-radius: 5px;
    font-size: 12px; font-variant-numeric: tabular-nums; cursor: default;
  }
  .pill.bull { background: var(--good-wash); color: var(--good-text); }
  .pill.bear { background: var(--bad-wash);  color: var(--bad-text); }
  .pill.na   { background: transparent; color: var(--muted); min-width: 0; }
  .pill .g { font-size: 10px; }
  .pill.fresh { outline: 1.5px solid currentColor; font-weight: 650; }
  .strip-sep { border-left: 1px solid var(--grid); }

  /* verdict badge — text label carries the meaning, colour reinforces */
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 5px;
    font-size: 10.5px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase;
    cursor: default; white-space: nowrap;
  }
  .badge.signal     { background: var(--good-wash); color: var(--good-text); outline: 1px solid currentColor; }
  .badge.contrarian { background: rgba(250,178,25,0.15); color: #9a6a00; outline: 1px solid currentColor; }
  .badge.noise, .badge.expired, .badge.unvalidated, .badge.nocross,
  .badge.thinhistory, .badge.unvalidatedclass {
    background: transparent; color: var(--muted); font-weight: 500;
    letter-spacing: 0.03em; text-transform: none; padding-left: 0;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .badge.contrarian { color: #fab219; }
  }
  :root[data-theme="dark"] .badge.contrarian { color: #fab219; }
  .score { font-size: 10.5px; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

  .align { display: inline-flex; gap: 2px; }
  .align i { width: 5px; height: 12px; border-radius: 1px; background: var(--baseline); }
  .align i.b { background: var(--good); }
  .align i.r { background: var(--bad); }

  /* ---- tooltip ---- */
  #tip {
    position: fixed; z-index: 50; pointer-events: none; opacity: 0;
    transition: opacity .09s; max-width: 290px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.16); padding: 9px 11px; font-size: 12px; line-height: 1.5;
  }
  #tip b { font-weight: 620; }
  #tip .r { display: flex; justify-content: space-between; gap: 14px; }
  #tip .r span:last-child { font-variant-numeric: tabular-nums; }
  #tip hr { border: none; border-top: 1px solid var(--grid); margin: 6px 0; }

  .legend { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 12px; color: var(--ink-2); margin: 12px 0 0; }
  .legend .k { display: inline-flex; align-items: center; gap: 5px; }
  footer { margin-top: 26px; font-size: 11.5px; color: var(--muted); line-height: 1.7; }
  .empty { padding: 44px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>EMA Cross Scanner</h1>
    </div>
    <button id="rescan">Rescan market</button>
  </header>
  <div class="sub" id="meta">loading…</div>

  <div class="controls">
    <div class="ctl" id="venueCtl" hidden>
      <label>Venue</label>
      <div class="seg" id="venue"></div>
    </div>
    <div class="ctl" id="classCtl" hidden>
      <label>Asset class</label>
      <div class="seg" id="klass"></div>
    </div>
    <div class="ctl">
      <label>EMA pair</label>
      <div class="seg" id="preset"></div>
    </div>
    <div class="ctl">
      <label>Focus timeframe</label>
      <div class="seg" id="focus"></div>
    </div>
    <div class="ctl">
      <label>Show</label>
      <div class="seg" id="filter">
        <button data-v="all" aria-pressed="true">All</button>
        <button data-v="golden">Golden</button>
        <button data-v="death">Death</button>
      </div>
    </div>
    <div class="ctl">
      <label>Verdict</label>
      <div class="seg" id="grade">
        <button data-v="any" aria-pressed="true">Any</button>
        <button data-v="graded">Graded only</button>
        <button data-v="signal">Signal only</button>
      </div>
    </div>
    <div class="ctl">
      <label for="fresh">Fresh only (≤ bars)</label>
      <select id="fresh">
        <option value="0">off</option>
        <option value="1">1</option>
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
      </select>
    </div>
    <div class="ctl">
      <label for="vol">Min 24h volume</label>
      <select id="vol">
        <option value="100000">$100k</option>
        <option value="500000">$500k</option>
        <option value="1000000" selected>$1M</option>
        <option value="5000000">$5M</option>
        <option value="25000000">$25M</option>
      </select>
    </div>
    <div class="ctl">
      <label for="q">Search</label>
      <input type="search" id="q" placeholder="BTC, SOL…">
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="tablewrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div class="legend">
    <span class="k"><span class="pill bull"><span class="g">▲</span>12</span> golden / above — bars since cross</span>
    <span class="k"><span class="pill bear"><span class="g">▼</span>12</span> death / below</span>
    <span class="k"><span class="pill bull fresh"><span class="g">▲</span>2</span> fresh cross (within window)</span>
    <span class="k"><span class="pill na">·</span> not enough history for this EMA pair</span>
    <span class="k"><span class="badge signal">Signal</span> beat the base rate out-of-sample</span>
    <span class="k"><span class="badge contrarian">Contrarian</span> edge runs opposite the cross</span>
    <span class="k"><span class="badge noise">noise</span> no measured edge — regime context only</span>
  </div>

  <footer id="foot"></footer>
</div>

<div id="tip"></div>

<script>
const TF_LABEL = {"1h":"1h","4h":"4h","12h":"12h","1d":"1d","1w":"1w"};
const GRADE_RANK = {signal: 0, contrarian: 1, noise: 2, expired: 3,
                    unvalidated: 4, "no cross": 5, "thin history": 6, unknown: 7};
const GRADE_LABEL = {signal: "Signal", contrarian: "Contrarian", noise: "noise",
                     expired: "expired", unvalidated: "not benchmarked",
                     "thin history": "thin history", "unvalidated class": "not benchmarked",
                     "unvalidated venue": "not benchmarked",
                     "no cross": "—", unknown: "—"};
const VENUE_LABEL = {binance: "Binance spot", hyperliquid: "Hyperliquid perps",
                     "hl:xyz": "trade.xyz (HIP-3)", "hl:mkts": "mkts (HIP-3)",
                     "hl:para": "para (HIP-3)", "hl:hyna": "hyna (HIP-3)"};
const venueShort = v => ({binance: "Binance", hyperliquid: "HL perps",
  "hl:xyz": "trade.xyz"})[v] || (v.startsWith("hl:") ? v.slice(3) : v);
const GATE_LABEL = {trend: "Slow EMA agrees with cross direction",
                    nochop: "No prior cross in last 100 bars (not chopping)",
                    volexp: "Volume ≥1.2× its 20-bar average at the cross",
                    momo: "Fast EMA agrees with cross direction"};
let DATA = null;
const S = { preset: "50/200", focus: "1d", filter: "all", grade: "any", venue: "all",
            klass: "all", fresh: 0, vol: 1e6, q: "", sort: "bars_since", dir: 1 };
// "rwa" is a flag, not a class: ONDO is RWA *and* crypto, TSLAB is RWA *and* equity.
const matchClass = c => S.klass === "all" ? true
  : S.klass === "rwa" ? !!c.rwa
  : (c.asset_class || "crypto") === S.klass;

/* ---------- formatting ---------- */
const fmtVol = v => v >= 1e9 ? "$" + (v/1e9).toFixed(2) + "B"
                  : v >= 1e6 ? "$" + (v/1e6).toFixed(1) + "M"
                  : "$" + Math.round(v/1e3) + "k";
function fmtPrice(p) {
  if (p >= 1000) return p.toLocaleString("en-US", {maximumFractionDigits: 0});
  if (p >= 1)    return p.toFixed(2);
  if (p >= 0.01) return p.toFixed(4);
  return p.toPrecision(3);
}
const pct = v => (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "dn" : "dim";
function ago(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 5400) return Math.round(s/60) + "m ago";
  if (s < 172800) return Math.round(s/3600) + "h ago";
  return Math.round(s/86400) + "d ago";
}

/* ---------- accessors ---------- */
const rec = (c, tf) => (c.tf?.[tf] || {})[S.preset] || null;
const isFresh = r => S.fresh > 0 && r && r.bars_since != null && r.bars_since <= S.fresh;

function alignCount(c) {   // how many timeframes agree bullish
  let b = 0, n = 0;
  for (const tf of DATA.timeframes) {
    const r = rec(c, tf);
    if (!r) continue;
    n++; if (r.state === "bull") b++;
  }
  return {bull: b, n};
}

/* ---------- rows ---------- */
function rows() {
  const q = S.q.trim().toUpperCase();
  let out = DATA.coins.filter(c => {
    if (S.venue !== "all" && c.venue !== S.venue) return false;
    if (!matchClass(c)) return false;
    if (c.quote_vol_24h < S.vol) return false;
    if (q && !c.symbol.includes(q)) return false;
    const r = rec(c, S.focus);
    if (!r) return false;
    if (S.filter === "golden" && r.state !== "bull") return false;
    if (S.filter === "death"  && r.state !== "bear") return false;
    if (S.fresh > 0 && !isFresh(r)) return false;
    if (S.grade === "graded" && !(r.grade === "signal" || r.grade === "contrarian")) return false;
    if (S.grade === "signal" && r.grade !== "signal") return false;
    return true;
  });

  const key = c => {
    const r = rec(c, S.focus);
    switch (S.sort) {
      case "symbol":     return c.symbol;
      case "price":      return c.price;
      case "change_24h": return c.change_24h;
      case "vol":        return c.quote_vol_24h;
      case "align":      return alignCount(c).bull;
      case "grade":      return GRADE_RANK[r.grade] ?? 9;
      case "bars_since": return r.bars_since == null ? Infinity : r.bars_since;
      case "since":      return r.pct_since_cross ?? -Infinity;
      case "spread":     return r.spread_pct;
      case "eta":        return r.eta_bars == null ? Infinity : r.eta_bars;
      default:           return 0;
    }
  };
  out.sort((a, b) => {
    const x = key(a), y = key(b);
    if (typeof x === "string") return S.dir * x.localeCompare(y);
    if (x === y) return b.quote_vol_24h - a.quote_vol_24h;   // liquidity breaks ties
    return S.dir * (x < y ? -1 : 1);
  });
  return out;
}

/* ---------- render: breadth tiles ---------- */
function renderTiles() {
  const host = document.getElementById("tiles");
  const eligible = DATA.coins.filter(c =>
    c.quote_vol_24h >= S.vol && (S.venue === "all" || c.venue === S.venue) && matchClass(c));
  host.innerHTML = DATA.timeframes.map(tf => {
    let bull = 0, n = 0, fg = 0, fd = 0, sig = 0;
    const W = S.fresh > 0 ? S.fresh : 3;
    for (const c of eligible) {
      const r = (c.tf?.[tf] || {})[S.preset];
      if (!r) continue;
      n++;
      if (r.state === "bull") bull++;
      if (r.bars_since != null && r.bars_since <= W) (r.state === "bull" ? fg++ : fd++);
      if (r.grade === "signal" || r.grade === "contrarian") sig++;
    }
    const share = n ? bull / n * 100 : 0;
    return `<div class="tile">
      <div class="tf">${TF_LABEL[tf]}</div>
      <div class="big">${n ? share.toFixed(0) + "%" : "—"}</div>
      <div class="cap">${bull}/${n} coins golden</div>
      <div class="meter"><i style="width:${share.toFixed(1)}%"></i></div>
      <div class="fr">
        <span class="${fg ? "up" : "dim"}">▲ ${fg} new</span>
        <span class="${fd ? "dn" : "dim"}">▼ ${fd} new</span>
        <span class="${sig ? "" : "dim"}" style="${sig ? "font-weight:620" : ""}">${sig} graded</span>
      </div>
    </div>`;
  }).join("");
}

/* ---------- render: table ---------- */
const COLS = [
  {k: "symbol",     t: "Coin",   c: "l"},
  {k: "price",      t: "Price"},
  {k: "change_24h", t: "24h"},
  {k: "vol",        t: "Vol 24h"},
  ...["1h","4h","12h","1d","1w"].map(tf => ({k: null, t: TF_LABEL[tf], c: "mid", tf})),
  {k: "align",      t: "Bull/5", c: "mid"},
  {k: "grade",      t: "Verdict", c: "l"},
  {k: "bars_since", t: "Bars since"},
  {k: "since",      t: "Δ since cross"},
  {k: "spread",     t: "EMA spread"},
  {k: "eta",        t: "Cross ETA (est)"},
];

function renderHead() {
  document.getElementById("head").innerHTML = COLS.map((col, i) => {
    if (!col.k) {
      const sep = col.tf === "1h" ? " strip-sep" : "";
      return `<th class="mid${sep}" data-nosort title="regime on ${col.t}">${col.t}</th>`;
    }
    const on = S.sort === col.k;
    const ar = on ? `<span class="ar">${S.dir === 1 ? "▲" : "▼"}</span>` : "";
    return `<th class="${col.c || ""}" data-k="${col.k}"${on ? ' style="color:var(--ink)"' : ""}>${col.t} ${ar}</th>`;
  }).join("");
  document.querySelectorAll("#head th[data-k]").forEach(th => {
    th.onclick = () => {
      const k = th.dataset.k;
      if (S.sort === k) S.dir *= -1;
      else { S.sort = k; S.dir = (k === "symbol" || k === "bars_since" || k === "eta") ? 1 : -1; }
      renderHead(); renderBody();
    };
  });
}

function pill(c, tf) {
  const r = rec(c, tf);
  if (!r) {
    const bars = (c.tf?.[tf] || {}).bars ?? 0;
    return `<span class="pill na" data-tip="${tf}|nohist|${bars}">·</span>`;
  }
  const bull = r.state === "bull";
  const n = r.bars_since == null ? "—" : r.bars_since;
  const fresh = isFresh(r) ? " fresh" : "";
  return `<span class="pill ${bull ? "bull" : "bear"}${fresh}" data-tip="${c.symbol}|${tf}">
    <span class="g">${bull ? "▲" : "▼"}</span>${n}</span>`;
}

function renderBody() {
  const rs = rows();
  const body = document.getElementById("body");
  if (!rs.length) {
    body.innerHTML = `<tr><td colspan="${COLS.length}" class="empty">No coins match these filters.</td></tr>`;
    return;
  }
  body.innerHTML = rs.map(c => {
    const r = rec(c, S.focus);
    const a = alignCount(c);
    const bars = [];
    for (const tf of DATA.timeframes) {
      const rr = rec(c, tf);
      bars.push(`<i class="${!rr ? "" : rr.state === "bull" ? "b" : "r"}"></i>`);
    }
    return `<tr>
      <td class="l coin">${c.base}<small>${c.venue.startsWith("hl:") ? "\u00b7" + c.venue.slice(3) : (c.quote_label || "USDT")}</small>${c.asset_class && c.asset_class !== "crypto" ? `<small class="tag">${c.asset_class}</small>` : (c.rwa ? `<small class="tag">rwa</small>` : "")}</td>
      <td>${fmtPrice(c.price)}</td>
      <td class="${cls(c.change_24h)}">${pct(c.change_24h)}</td>
      <td class="dim">${fmtVol(c.quote_vol_24h)}</td>
      ${DATA.timeframes.map((tf, i) => `<td class="cell${i === 0 ? " strip-sep" : ""}">${pill(c, tf)}</td>`).join("")}
      <td class="cell"><span class="align" data-tip="${c.symbol}|align">${bars.join("")}</span>
        <div style="font-size:11px;color:var(--muted);margin-top:1px">${a.bull}/${a.n}</div></td>
      <td class="l"><span class="badge ${(r.grade||"unknown").replace(" ","")}"
        data-tip="${c.symbol}|${S.focus}|grade">${GRADE_LABEL[r.grade] || "—"}</span>${
        r.score != null ? `<span class="score">${r.score}/4</span>` : ""}${
        // score>=3 can be met by trend+nochop+momo alone, so a graded cross may have had
        // no volume behind it. Say so on the badge rather than only in the tooltip.
        (r.grade === "signal" || r.grade === "contrarian") && r.gates && !r.gates.volexp
          ? '<span class="score" style="color:var(--warn,#c9862b)" title="No volume expansion at the cross">no vol</span>' : ""}</td>
      <td>${r.bars_since == null
        ? `<span class="dim">${r.grade === "thin history" ? "too short" : "no cross"}</span>`
        : r.bars_since}</td>
      <td class="${r.pct_since_cross == null ? "dim" : cls(r.pct_since_cross)}">${r.pct_since_cross == null ? "—" : pct(r.pct_since_cross)}</td>
      <td class="${cls(r.spread_pct)}">${pct(r.spread_pct)}</td>
      <td class="${r.eta_bars == null ? "dim" : r.eta_bars <= 10 ? "" : "dim"}"
          ${r.eta_bars == null ? 'data-tip="' + c.symbol + '|' + S.focus + '"' : ""}>${
        r.eta_bars == null ? "diverging" :
        (r.eta_bars <= 10 ? "<b>" + r.eta_bars + " bars</b>" : r.eta_bars + " bars")}</td>
    </tr>`;
  }).join("");
  wireTips();
}

/* ---------- tooltips ---------- */
const tipEl = document.getElementById("tip");
function wireTips() {
  document.querySelectorAll("[data-tip]").forEach(el => {
    el.onmouseenter = e => {
      const html = tipHTML(el.dataset.tip);
      if (!html) return;
      tipEl.innerHTML = html;
      tipEl.style.opacity = 1;
      place(e);
    };
    el.onmousemove = place;
    el.onmouseleave = () => { tipEl.style.opacity = 0; };
  });
}
function place(e) {
  const r = tipEl.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
}
const row = (a, b) => `<div class="r"><span class="dim">${a}</span><span>${b}</span></div>`;

function tipHTML(spec) {
  const [sym, tf, extra] = spec.split("|");
  if (tf === "nohist") {
    const [fp, sp] = DATA.presets[S.preset];
    return `<b>Not enough history</b><hr>${row("Closed bars", extra)}${row("Needed for EMA" + sp, sp + 5)}
      <div class="dim" style="margin-top:6px">Newly listed pair — EMA${sp} can't be computed yet.</div>`;
  }
  const c = DATA.coins.find(x => x.symbol === sym);
  if (!c) return "";
  if (tf === "align") {
    return `<b>${c.base}</b> — multi-timeframe regime<hr>` + DATA.timeframes.map(t => {
      const r = rec(c, t);
      return row(TF_LABEL[t], !r ? "—" : (r.state === "bull" ? "▲ golden" : "▼ death") +
        (r.bars_since != null ? ` · ${r.bars_since} bars` : ""));
    }).join("");
  }
  const r = rec(c, tf);
  if (!r) return "";
  const [fp, sp] = DATA.presets[S.preset];
  let h = `<b>${c.base}${c.quote_label || "USDT"} · ${TF_LABEL[tf]}</b>` +
          `<div class="dim" style="font-size:11px">${VENUE_LABEL[c.venue] || c.venue}</div><hr>`;
  const st = (c.tf?.[tf] || {}).synthetic_trimmed;
  if (st) h += row("Synthetic bars trimmed", st + " pre-listing");
  if (r.warmup_bars != null && r.warmup_bars < 1.5 * sp)
    h += row("⚠ EMA" + sp + " warmup", r.warmup_bars + " bars (thin)");
  h += row(`EMA${fp}`, fmtPrice(r.fast));
  h += row(`EMA${sp}`, fmtPrice(r.slow));
  h += row("Close", fmtPrice(r.close));
  h += row("EMA spread", pct(r.spread_pct));
  h += row("Next cross (est)", r.eta_bars == null ? "diverging — not converging"
                                                 : "~" + r.eta_bars + " bars at current rate");
  h += row("Price vs both EMAs", r.above_both ? "above both" : "not above both");
  h += "<hr>";
  if (r.bars_since == null) {
    h += row("Cross", `none in last ${r.search_bars} bars`);
    h += row("Regime", r.state === "bull" ? "▲ golden" : "▼ death");
    if (r.grade === "thin history")
      h += `<div class="dim" style="margin-top:6px;line-height:1.45">Only ${r.bars_available} bars past the EMA${sp} seed. ` +
           `The series is too short to have contained a cross — this is not evidence the regime held.</div>`;
  } else {
    h += row("Cross", (r.cross === "golden" ? "▲ golden" : "▼ death") + ` · ${r.bars_since} bars ago`);
    h += row("Crossed at", fmtPrice(r.cross_price) + "  (" + ago(r.cross_time) + ")");
    h += row("Since cross", pct(r.pct_since_cross));
    h += row("Best / worst since", pct(r.mfe_pct) + " / " + pct(r.mae_pct));
  }
  if (r.gates) {
    h += `<hr><b>Verdict: ${GRADE_LABEL[r.grade]}</b> &nbsp;${r.score}/4 gates<div style="margin-top:5px">`;
    for (const [k, v] of Object.entries(r.gates)) {
      h += `<div class="r"><span class="${v ? "" : "dim"}">${v ? "✓" : "✗"} ${GATE_LABEL[k]}</span></div>`;
    }
    h += "</div>";
    const why = {
      signal: "Benchmarked: 1d golden + score ≥3 → +4.0pp median edge over base rate at 20 bars (n=96, holds in both history halves).",
      contrarian: "Benchmarked: 4h death + score ≥3 behaves as a MEAN-REVERSION LONG, not a short (+1.2pp edge, 56% win vs 45% base).",
      noise: "This timeframe/side did not beat the base rate out-of-sample. Treat as regime context only.",
      expired: "Cross is older than the 20-bar horizon the edge was measured over — no longer a live signal.",
      unvalidated: "Only the 50/200 pair was benchmarked. 21/55 gets a score but no verdict.",
      "unvalidated class": "The signal rules were validated on crypto only. This is a tokenized real-world asset, so no verdict is claimed.",
      "unvalidated venue": "The signal rules were fitted on Binance spot. On this venue's own history the rule does not survive out of sample " +
        "(1d golden: +11.99pp early half, −2.96pp late; 4h death: +2.81pp early, −0.29pp late), so no verdict is claimed.",
      "thin history": "Too few bars past the EMA" + sp + " seed for the slow EMA itself to be reliable, so no verdict is claimed.",
    }[r.grade];
    if (why) h += `<div class="dim" style="margin-top:6px;line-height:1.45">${why}</div>`;
  }
  return h;
}

/* ---------- controls ---------- */
function seg(id, values, cur, set) {
  const host = document.getElementById(id);
  host.innerHTML = values.map(v =>
    `<button data-v="${v}" aria-pressed="${v === cur}">${TF_LABEL[v] || v}</button>`).join("");
  host.querySelectorAll("button").forEach(b => {
    b.onclick = () => { set(b.dataset.v); renderAll(); };
  });
}

function renderAll() {
  seg("preset", Object.keys(DATA.presets), S.preset, v => S.preset = v);
  seg("focus", DATA.timeframes, S.focus, v => S.focus = v);
  document.querySelectorAll("#filter button").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.v === S.filter);
    b.onclick = () => { S.filter = b.dataset.v; renderAll(); };
  });
  document.querySelectorAll("#grade button").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.v === S.grade);
    b.onclick = () => { S.grade = b.dataset.v; renderAll(); };
  });
  const present = [...new Set(DATA.coins.map(c => c.asset_class).filter(Boolean))];
  const order = ["crypto", "equity", "index", "commodity", "fx", "treasury"];
  const CL_LABEL = {crypto: "Crypto", equity: "Equity", index: "Index",
                    commodity: "Commodity", fx: "FX", treasury: "Treasury"};
  const khost = document.getElementById("klass");
  document.getElementById("classCtl").hidden = !present.length;
  khost.innerHTML = ["all", "rwa", ...order.filter(k => present.includes(k))].map(k =>
    `<button data-v="${k}" aria-pressed="${k === S.klass}">${
      k === "all" ? "All" : k === "rwa" ? "RWA" : CL_LABEL[k]}</button>`).join("");
  khost.querySelectorAll("button").forEach(b => {
    b.onclick = () => { S.klass = b.dataset.v; renderAll(); };
  });
  // Venue control only appears when the scan actually covered more than one venue.
  const vs = DATA.venues || [];
  document.getElementById("venueCtl").hidden = vs.length < 2;
  const vhost = document.getElementById("venue");
  vhost.innerHTML = ["all", ...vs].map(v =>
    `<button data-v="${v}" aria-pressed="${v === S.venue}">${
      v === "all" ? "All" : venueShort(v)}</button>`).join("");
  vhost.querySelectorAll("button").forEach(b => {
    b.onclick = () => { S.venue = b.dataset.v; renderAll(); };
  });
  renderTiles(); renderHead(); renderBody();
}

document.getElementById("fresh").onchange = e => { S.fresh = +e.target.value; renderAll(); };
document.getElementById("vol").onchange   = e => { S.vol = +e.target.value; renderAll(); };
document.getElementById("q").oninput      = e => { S.q = e.target.value; renderBody(); };

document.getElementById("rescan").onclick = async () => {
  const b = document.getElementById("rescan");
  b.disabled = true; b.textContent = "Scanning…";
  try {
    const r = await fetch("/api/rescan", {method: "POST"});
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    const poll = setInterval(async () => {
      const s = await (await fetch("/api/status")).json();
      if (!s.running) { clearInterval(poll); await load(); b.disabled = false; b.textContent = "Rescan market"; }
    }, 3000);
  } catch (e) {
    b.disabled = false; b.textContent = "Rescan market";
    alert("Rescan failed: " + e.message);
  }
};

/* ---------- load ---------- */
async function load() {
  const r = await fetch("/api/scan");
  if (!r.ok) { document.getElementById("meta").textContent = "No scan yet — run scanner.py"; return; }
  DATA = await r.json();
  const [fp, sp] = DATA.presets[S.preset];
  const byVenue = {};
  for (const c of DATA.coins) byVenue[c.venue] = (byVenue[c.venue] || 0) + 1;
  const vtxt = (DATA.venues || ["binance"])
    .map(v => `<b>${byVenue[v] || 0}</b> ${VENUE_LABEL[v] || v}`).join(" + ");
  document.getElementById("meta").innerHTML =
    `${vtxt} · scanned <b>${ago(DATA.generated_at)}</b> · ` +
    `EMA crosses on <b>closed candles only</b> · ${DATA.bars_requested} bars per series`;
  document.getElementById("foot").innerHTML =
    `Source: ${DATA.source}. Binance = spot pairs quoted in USDT with status TRADING; ` +
    `Hyperliquid = non-delisted perps, volume is 24h <b>notional</b> (not directly comparable to spot ` +
    `volume). Both filtered to 24h volume ≥ ${fmtVol(DATA.min_vol)}; stablecoin and leveraged ` +
    `(UP/DOWN/BULL/BEAR) pairs excluded. ` +
    (DATA.synthetic_series_trimmed
      ? `<b>${DATA.synthetic_series_trimmed} Hyperliquid series had synthetic pre-listing candles ` +
        `trimmed</b> — HL backfills zero-trade candles from before a coin was listed (BTC weekly ` +
        `reaches 2019, ZEC 1d returned 704 such bars), which would otherwise poison the EMA200. ` +
        `HL weekly EMA200 is unavailable for every market: the exchange has ~179 real weekly bars ` +
        `and 200 are required. `
      : "") +
    `EMAs are SMA-seeded over ${DATA.bars_requested} bars, computed on closed candles — the in-progress ` +
    `candle is discarded, so a cross cannot flicker intra-bar. "Bars since" counts closed bars since the ` +
    `most recent EMA crossover; "no cross" means none occurred inside the available window. ` +
    `"Cross ETA" is an <b>estimate</b>: the current EMA spread divided by its rate of change over ` +
    `the last 10 bars, linearly extrapolated — "diverging" means the EMAs are moving apart, not converging. ` +
    (DATA.excluded_pegged?.length
      ? `Pegged assets are excluded (an EMA cross on a stablecoin is noise), detected from price history ` +
        `rather than a ticker list — this run dropped ${DATA.excluded_pegged.length}: ` +
        `${DATA.excluded_pegged.join(", ")}. `
      : "") +
    `<br><br><b>Verdict</b> comes from <code>benchmark.py</code>: every cross in the deep history of ` +
    `100 liquid coins was scored on 4 gates measurable at the cross bar (slow-EMA trend, no prior ` +
    `cross in 100 bars, volume ≥1.2× its 20-bar average, fast-EMA momentum), then forward returns ` +
    `were compared to the unconditional base rate over the same bars, with history split in half ` +
    `to check the edge holds out-of-sample. Only <b>1d golden, score ≥3</b> (+4.0pp median edge, ` +
    `n=96) and <b>4h death, score ≥3</b> (+1.2pp — a mean-reversion <i>long</i>, not a short) ` +
    `survived. Every other timeframe/side is labelled <b>noise</b> because it did not beat the base ` +
    `rate, and a cross older than 20 bars is <b>expired</b> since that is the horizon the edge was ` +
    `measured over. Backtest caveats: survivorship bias, overlapping windows, no fees or slippage. ` +
    `A cross is a lagging trend confirmation, not a trade signal.`;
  renderAll();
}
load();
</script>
</body>
</html>
